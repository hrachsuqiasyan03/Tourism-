name: first
description: A virtual tourism and travel planning application.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # OpenStreetMap
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  geolocator: ^14.1.1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/regions/
    - assets/images/places/
